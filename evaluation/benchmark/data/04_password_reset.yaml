id: "04-password-reset"
title: "Password reset via email"
user_story: >
  As a user who forgot my password, I want to request a reset link by email and
  set a new password so that I can regain access to my account securely.
project_name: "Generic SaaS Account"
base_url: "http://localhost:8001"
allowed_domains: ["localhost", "127.0.0.1"]

requirement:
  id: "REQ-PWD-RESET"
  title: "Password reset"
  text: >
    A user can request a password reset by submitting their account email. The
    system sends a time-limited, single-use reset link. Following the link lets
    the user set a new password that meets the password policy. Reset links
    expire after 30 minutes and cannot be reused. For privacy, the request
    confirmation must not reveal whether an email is registered.
  acceptance_criteria:
    - "Submitting a registered email triggers a reset link and a neutral confirmation."
    - "Submitting an unregistered email shows the same neutral confirmation (no account enumeration)."
    - "A valid, unexpired link allows setting a new policy-compliant password."
    - "An expired or already-used link is rejected."
    - "A new password that violates the policy is rejected with guidance."

expected_test_types: ["UI", "API", "security", "regression"]
expected_categories: ["positive", "negative", "boundary", "validation", "security", "error_handling"]
min_cases: 10

coverage_checklist:
  - id: "request-registered"
    description: "Requesting reset for a registered email sends a link and confirms neutrally."
    keywords: ["registered", "reset link", "email", "confirmation"]
  - id: "no-enumeration"
    description: "Unregistered email yields the same confirmation (no account enumeration)."
    keywords: ["enumeration", "unregistered", "same", "privacy", "neutral"]
  - id: "expired-link"
    description: "An expired reset link is rejected."
    keywords: ["expired", "expire", "timeout", "30"]
  - id: "reused-link"
    description: "A single-use link cannot be reused after a successful reset."
    keywords: ["reuse", "single-use", "already used", "invalid"]
  - id: "weak-password"
    description: "A new password violating the policy is rejected with guidance."
    keywords: ["weak", "policy", "too short", "invalid password"]

reference_test_cases:
  - id: "REF-PWD-1"
    case_key: "TC-001"
    requirement_ids: ["REQ-PWD-RESET"]
    title: "Request reset for a registered email"
    objective: "Verify a registered email receives a reset link with a neutral confirmation."
    category: "positive"
    priority: "high"
    preconditions: ["A registered account exists"]
    test_data: {email: "QA_TEST_USERNAME"}
    steps:
      - "Open the forgot-password page"
      - "Enter a registered account email"
      - "Submit the request"
    expected_results:
      - "A neutral confirmation message is shown"
      - "A reset link is issued for the account"
    automation_suitability: "needs_review"
