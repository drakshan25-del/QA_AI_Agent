server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA client-side routing: unknown paths fall back to index.html so
  # react-router handles them (no full reload, FR-FE-002).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets; never cache the HTML entrypoint.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
