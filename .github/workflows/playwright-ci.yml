# Playwright CI pipeline for AI-generated tests (SRS §12.2).
# No Ollama / LLM step runs in CI — generation happens locally only (§12.3).
#
# Two suites, separated deliberately:
#   - smoke: targets the bundled sample app started inside the runner; always runs.
#   - generated: targets the project's real staging environment; runs ONLY when
#     the repository defines the QA_TARGET_BASE_URL variable and credentials
#     secrets — otherwise those tests would run against the wrong host and fail
#     by construction.
name: Playwright CI

on:
  push:
    branches:
      - main
      - 'ai-tests/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/qa-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/qa-engine/uv.lock"

      # §12.2: reproducible dependency set — install from the committed uv.lock.
      # uv provisions the Python pinned in .python-version automatically.
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Collect tests (early gate)
        run: uv run pytest --collect-only -q

      - name: Start sample app in background
        run: |
          uv run python -m uvicorn sample_app.main:app --port 8001 &
          sleep 3

      # §12.2: publish machine-readable (JUnit) and human-readable (HTML) reports.
      - name: Run smoke suite against the sample app
        run: >
          uv run pytest -m smoke
          --junitxml=reports/junit.xml
          --html=reports/report.html --self-contained-html
          --screenshot only-on-failure --tracing retain-on-failure
          --output artifacts/ci

      # Generated tests were authored against the configured staging target;
      # skip them entirely unless that target (and its credentials) exist.
      - name: Run generated suite against the configured target
        if: vars.QA_TARGET_BASE_URL != ''
        env:
          QA_TARGET_BASE_URL: ${{ vars.QA_TARGET_BASE_URL }}
          QA_ALLOWED_DOMAINS: ${{ vars.QA_ALLOWED_DOMAINS }}
          QA_TEST_USERNAME: ${{ secrets.QA_TEST_USERNAME }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: >
          uv run pytest -m generated
          --junitxml=reports/junit-generated.xml
          --html=reports/report-generated.html --self-contained-html
          --screenshot only-on-failure --tracing retain-on-failure
          --output artifacts/ci-generated

      # §12.2 step 9: always publish reports and traces, even on failure.
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/qa-engine/reports/
            apps/qa-engine/artifacts/
          if-no-files-found: warn
