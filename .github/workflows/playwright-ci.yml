# Playwright CI pipeline for AI-generated tests (SRS §12.2).
# No Ollama / LLM step runs in CI — generation happens locally only (§12.3).
name: Playwright CI

on:
  push:
    branches:
      - main
      - 'ai-tests/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # §12.2: reproducible dependency set — install from the pip-freeze lock.
      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Collect tests (early gate)
        run: pytest --collect-only -q

      - name: Start sample app in background
        run: |
          python -m uvicorn sample_app.main:app --port 8001 &
          sleep 3

      # §12.2: publish machine-readable (JUnit) and human-readable (HTML) reports.
      - name: Run smoke and generated tests
        run: pytest -m "smoke or generated" --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html --screenshot only-on-failure --tracing retain-on-failure --output artifacts/ci

      # §12.2 step 9: always publish reports and traces, even on failure.
      - name: Upload reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            reports/
            artifacts/ci
          if-no-files-found: warn
